name: Bootstrap TARA from Manvi

on:
  push:
    paths:
      - '.github/workflows/bootstrap-manvi.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TARA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Manvi foundation
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/viswabnath/whatsapp-reminder-bot.git "$tmp/manvi"

          # Import the application foundation without replacing TARA's product README.
          cp -R "$tmp/manvi/src" ./src
          cp -R "$tmp/manvi/public" ./public
          cp "$tmp/manvi/test.js" ./test.js
          cp "$tmp/manvi/env.example" ./env.example
          cp "$tmp/manvi/eslint.config.mjs" ./eslint.config.mjs
          cp "$tmp/manvi/package.json" ./package.json
          cp "$tmp/manvi/package-lock.json" ./package-lock.json
          cp "$tmp/manvi/.gitignore" ./.gitignore

          # Do not carry upstream owner-specific context into TARA.
          rm -f ./AI_CONTEXT.md

          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.name = 'tara-personal-ai';
          p.version = '0.1.0';
          p.description = 'TARA — a WhatsApp-first personal AI companion';
          delete p.author;
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.name = 'tara-personal-ai';
          if (lock.packages && lock.packages['']) lock.packages[''].name = 'tara-personal-ai';
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE

          cat > FOUNDATION.md <<'EOF'
          # TARA Foundation

          TARA's initial runtime foundation is adapted from the public Manvi WhatsApp assistant.

          Upstream: https://github.com/viswabnath/whatsapp-reminder-bot

          The imported foundation provides the initial WhatsApp Cloud API integration, Supabase persistence, reminder/routine/recurring scheduling, web search, AI waterfall, conversational memory, usage tracking, health endpoints and tests. It will be progressively refactored into TARA modules.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Bootstrap TARA from Manvi foundation' || exit 0
          git push
